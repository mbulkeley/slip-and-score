# nginx site for Slip & Score, behind Cloudflare Tunnel.
#
#   Cloudflare (HTTPS, Access) → cloudflared → nginx 127.0.0.1:8090 → gunicorn 127.0.0.1:8002
#
# Shares the 127.0.0.1:8090 listener with other sites; nginx picks this block
# by server_name. Assumes a default_server on that listener already exists
# (it drops unknown hosts) — if this is the first site, add one, e.g.:
#     server { listen 127.0.0.1:8090 default_server; server_name _; return 444; }
#
# On 32-bit (armhf) nginx, long server_names need
#     server_names_hash_bucket_size 64;
# in /etc/nginx/conf.d/ or `nginx -t` fails.
#
# Install:  sudo cp deploy/nginx-slip-and-score.conf /etc/nginx/sites-available/slip-and-score
#           sudo ln -s /etc/nginx/sites-available/slip-and-score /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8090;
    server_name ceramics.mauriecloud.com;

    # Several 3–8MB phone photos per upload. Cloudflare's free plan caps a
    # request at 100MB, so stay just under that.
    client_max_body_size 95m;

    access_log /var/log/nginx/slip-and-score.access.log;
    error_log  /var/log/nginx/slip-and-score.error.log;

    location /static/ {
        alias /home/pi/Projects/slip-and-score/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Photos have random UUID names. While the whole site is behind
    # Cloudflare Access, nginx serves them directly. A future public gallery
    # should switch this to an `internal;` location served via Django +
    # X-Accel-Redirect, so private pieces' photos stay private.
    location /media/ {
        alias /home/pi/Projects/slip-and-score/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        proxy_request_buffering on;   # take the whole upload before bothering gunicorn
    }
}
