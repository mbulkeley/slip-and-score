name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Catches private strings that gitleaks does not treat as secrets:
      # host names, server paths, internal machine names. The patterns live in
      # a repository secret so this public file never spells them out.
      # Unset secret => the step passes, so forks and first-time setup are fine.
      - name: Check for private strings
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ -z "${PRIVATE_PATTERNS}" ]; then
            echo "PRIVATE_PATTERNS is not set - skipping private string check."
            exit 0
          fi
          matches=$(grep -rIlE "${PRIVATE_PATTERNS}" --exclude-dir=.git . || true)
          if [ -n "${matches}" ]; then
            echo "::error::Private strings found in the files listed below."
            echo "${matches}"
            exit 1
          fi
          echo "No private strings found."
